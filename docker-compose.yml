services:
  caddy:
    image: caddy:2-alpine
    container_name: astro_caddy
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build: .
    container_name: astro_app
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000

volumes:
  caddy_data:
  caddy_config:
